name: Python CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies
        # ChromaDB 1.5.9 is the latest release, but these advisories have no
        # published fix versions. Keep the audit strict for actionable fixes.
        run: >-
          pip install pip-audit &&
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

      - name: Run tests
        run: python -m pytest

      - name: Compile Python modules
        run: python -m py_compile app.py database.py ingest.py llm.py models.py pdf_processor.py rag.py
